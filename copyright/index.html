<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta
      name="description"
      content="Retro error-style copyright surface for QUANTIFYREALITY and related properties."
    />
    <link rel="canonical" href="https://quantifyreality.com/copyright/" />
    <title>Copyright Error</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #000;
        --green: #98ff7b;
        --green-soft: #67cf63;
        --amber: #d4b86a;
        --white: #e2ffe1;
        font-family: "Lucida Console", "Terminal", monospace;
        background: var(--bg);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at 50% 8%, rgba(64, 255, 92, 0.08), transparent 24%),
          linear-gradient(180deg, #000 0%, #020402 100%);
      }

      body {
        min-height: 100vh;
        color: var(--green);
        overflow: hidden;
      }

      .scanlines,
      .static {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .scanlines {
        background:
          repeating-linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.014) 0,
            rgba(255, 255, 255, 0.014) 1px,
            transparent 2px,
            transparent 4px
          );
        mix-blend-mode: screen;
        opacity: 0.34;
      }

      .static {
        background:
          radial-gradient(circle at 30% 20%, rgba(151, 255, 122, 0.05), transparent 18%),
          radial-gradient(circle at 70% 80%, rgba(151, 255, 122, 0.03), transparent 16%),
          repeating-linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.018) 0,
            rgba(255, 255, 255, 0.018) 1px,
            transparent 3px,
            transparent 5px
          );
        opacity: 0.18;
        animation: drift 6s linear infinite;
      }

      .shell {
        position: relative;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 18px 14px 22px;
      }

      .panel {
        width: min(1000px, 100%);
        padding: 18px 16px 14px;
        border: 1px solid rgba(151, 255, 122, 0.16);
        background:
          linear-gradient(180deg, rgba(4, 10, 5, 0.97), rgba(0, 0, 0, 0.97)),
          #000;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.03) inset,
          0 0 42px rgba(74, 255, 116, 0.08);
      }

      .error {
        display: grid;
        gap: 7px;
        margin-bottom: 14px;
        padding: 14px 14px 12px;
        border: 1px solid rgba(151, 255, 122, 0.16);
        background: rgba(0, 0, 0, 0.82);
      }

      .error-line {
        display: block;
        width: fit-content;
        color: var(--green-soft);
        font-size: 11px;
        line-height: 1.28;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        text-shadow: 0 0 10px rgba(111, 255, 126, 0.18);
        -webkit-font-smoothing: none;
        -moz-osx-font-smoothing: grayscale;
        font-variant-ligatures: none;
      }

      .error-word {
        display: inline-block;
        opacity: 0;
        transform: translateX(-12px) skewX(-10deg);
        filter: blur(0.2px);
        animation: flipIn 240ms steps(5, end) forwards;
        margin-right: 0.42em;
      }

      .title {
        margin-top: 16px;
        font-size: clamp(1.45rem, 3.6vw, 2.7rem);
        line-height: 0.98;
        letter-spacing: 0.08em;
        color: var(--white);
        text-shadow:
          0 0 8px rgba(126, 255, 118, 0.24),
          0 0 20px rgba(126, 255, 118, 0.1);
      }

      .title,
      .copy-line,
      .list-item {
        opacity: 0;
        transform: translateY(4px);
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .divider {
        margin: 14px 0 16px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(151, 255, 122, 0.32), transparent);
      }

      .bodycopy {
        display: grid;
        gap: 10px;
        max-width: 84ch;
        color: #c9ffbf;
        font-size: 11px;
        line-height: 1.5;
        letter-spacing: 0.02em;
        font-family: "Lucida Console", "Terminal", monospace;
        -webkit-font-smoothing: none;
        -moz-osx-font-smoothing: grayscale;
        font-variant-ligatures: none;
      }

      .bodycopy p {
        margin: 0;
      }

      .bodycopy .emph {
        color: var(--white);
      }

      .box {
        margin-top: 14px;
        padding: 12px 12px 10px;
        border: 1px solid rgba(151, 255, 122, 0.16);
        background: rgba(0, 0, 0, 0.55);
      }

      .box-title {
        margin-bottom: 8px;
        color: var(--amber);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 11px;
      }

      .list {
        display: grid;
        gap: 7px;
        margin: 0;
        padding: 0;
        list-style: none;
        color: #bbf7b1;
        font-size: 10px;
        line-height: 1.42;
      }

      .list li {
        position: relative;
        padding-left: 14px;
      }

      .list li::before {
        content: ">";
        position: absolute;
        left: 0;
        color: var(--green);
      }

      .footer-stack {
        position: fixed;
        right: 10px;
        bottom: 12px;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        pointer-events: none;
      }

      .footer-stack > * {
        pointer-events: auto;
      }

      .copyright-badge,
      .requantify-link {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 0 11px;
        border-radius: 999px;
        text-decoration: none;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-size: 10px;
        transition: opacity 120ms ease, transform 120ms ease, background 120ms ease;
      }

      .copyright-badge {
        gap: 4px;
        color: rgba(223, 255, 213, 0.86);
        border: 1px solid rgba(151, 255, 122, 0.22);
        background: rgba(0, 0, 0, 0.58);
        opacity: 0.82;
      }

      .copyright-mark {
        color: var(--green);
        font-size: 11px;
      }

      .copyright-label {
        color: rgba(223, 255, 213, 0.76);
      }

      .requantify-link {
        color: rgba(214, 255, 212, 0.82);
        border: 1px solid rgba(151, 255, 122, 0.2);
        background: rgba(0, 0, 0, 0.52);
        opacity: 0.72;
      }

      .copyright-badge:hover,
      .copyright-badge:focus-visible,
      .requantify-link:hover,
      .requantify-link:focus-visible {
        opacity: 1;
        transform: translateY(-1px);
      }

      .top-links {
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 25;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .top-links a {
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        padding: 0 10px;
        border: 1px solid rgba(151, 255, 122, 0.18);
        background: rgba(0, 0, 0, 0.56);
        color: rgba(223, 255, 213, 0.8);
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-size: 10px;
        opacity: 0.92;
      }

      .top-links a:hover,
      .top-links a:focus-visible {
        opacity: 1;
      }

      @keyframes flipIn {
        0% {
          opacity: 0;
          transform: translateX(-12px) rotateX(82deg) scaleY(0.72);
        }
        75% {
          opacity: 1;
          transform: translateX(1px) rotateX(-8deg) scaleY(1.02);
        }
        100% {
          opacity: 1;
          transform: translateX(0) rotateX(0) scaleY(1);
        }
      }

      @keyframes drift {
        0% {
          transform: translate3d(0, 0, 0);
        }
        50% {
          transform: translate3d(1px, -1px, 0);
        }
        100% {
          transform: translate3d(0, 0, 0);
        }
      }

      @media (max-width: 720px) {
        body {
          overflow: auto;
        }

        .shell {
          padding: 12px 10px 18px;
        }

        .panel {
          padding: 14px 12px 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="static" aria-hidden="true"></div>

    <nav class="top-links" aria-label="Page links">
      <a href="/">home</a>
      <a href="/legal/">legal</a>
    </nav>

    <nav class="footer-stack" aria-label="Ownership links">
      <a class="copyright-badge" href="/copyright/" aria-label="Open copyright error screen">
        <span class="copyright-mark">&copy;</span>
        <span>2026 QUANTIFYREALITY</span>
        <span class="copyright-label">copyright</span>
      </a>
      <a class="requantify-link" href="/">REQUANTIFY</a>
    </nav>

    <main class="shell">
      <section class="panel" aria-label="Copyright error screen">
        <div class="error">
          <div class="error-line" data-phrase="ERR 01 COPYRIGHT LOCK ENGAGED"></div>
          <div class="error-line" data-phrase="ERR 02 FALSE CLAIMS SHUT DOWN"></div>
          <div class="error-line" data-phrase="ERR 03 RIGHTS RESERVED / ACCESS LOGGED"></div>
        </div>

        <div class="title" id="title-line" data-title="COPYWRITE ACTUAL PROTECTIONS"></div>
        <div class="divider"></div>

        <div class="bodycopy">
          <p class="copy-line" data-type="QUANTIFYREALITY asserts copyright over original expression published here and across related properties unless a separate signed transfer says otherwise."></p>
          <p class="copy-line emph" data-type="The work below stays in your control: text, code, layout, graphics, media, and original arrangement."></p>
        </div>

        <div class="box">
          <div class="box-title">actual protections</div>
          <ul class="list">
            <li class="list-item" data-type="Do not copy, distribute, republish, or mirror original expression without permission."></li>
            <li class="list-item" data-type="Linkage between properties does not transfer ownership or rights by itself."></li>
            <li class="list-item" data-type="Names, short phrases, brand labels, and domain names are handled separately from copyright."></li>
            <li class="list-item" data-type="Written assignment, work-for-hire, registrar control, and trademark filing remain the enforceable path."></li>
            <li class="list-item" data-type="All rights reserved pending any later transfer document or signed bundle terms."></li>
          </ul>
        </div>
      </section>
    </main>

    <script>
      window.addEventListener("load", async () => {
        const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
        const errors = Array.from(document.querySelectorAll("[data-phrase]"));
        const title = document.getElementById("title-line");
        const lines = Array.from(document.querySelectorAll("[data-type]"));

        const typeWords = async (node, text, speed = 120) => {
          node.textContent = "";
          const words = text.split(/\s+/).filter(Boolean);
          for (const word of words) {
            const span = document.createElement("span");
            span.className = "error-word";
            span.textContent = word;
            node.appendChild(span);
            node.appendChild(document.createTextNode(" "));
            await sleep(speed);
          }
        };

        for (const line of errors) {
          await typeWords(line, line.dataset.phrase || "", 120);
          await sleep(180);
        }

        await sleep(240);
        await typeWords(title, title.dataset.title || "", 88);
        title.style.opacity = 1;
        title.style.transform = "translateY(0)";

        for (const node of lines) {
          await sleep(220);
          await typeWords(node, node.dataset.type || "", 20);
          node.style.opacity = 1;
          node.style.transform = "translateY(0)";
        }
      });
    </script>
  </body>
</html>
